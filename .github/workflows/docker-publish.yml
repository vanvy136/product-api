name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Docker Hub secret format
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Username length: ${#DOCKERHUB_USERNAME}"
          echo "Token length: ${#DOCKERHUB_TOKEN}"

          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "ERROR: DOCKERHUB_USERNAME is empty"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "ERROR: DOCKERHUB_TOKEN is empty"
            exit 1
          fi

          case "$DOCKERHUB_TOKEN" in
            dckr_pat_*)
              echo "Token prefix: OK"
              ;;
            *)
              echo "WARNING: Token does not start with dckr_pat_"
              ;;
          esac

          if [[ "$DOCKERHUB_TOKEN" == *$'\n'* ]]; then
            echo "ERROR: Token contains newline"
            exit 1
          fi

          if [[ "$DOCKERHUB_TOKEN" == *$'\r'* ]]; then
            echo "ERROR: Token contains carriage return"
            exit 1
          fi

          if [[ "$DOCKERHUB_TOKEN" == *" "* ]]; then
            echo "ERROR: Token contains space"
            exit 1
          fi

          echo "Secret format check passed"

      - name: Login to Docker Hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}
  deploy:
      needs: docker
      runs-on: self-hosted

      steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Pull latest Docker images
          shell: cmd
          run: |
            docker compose -f docker-compose-prod.yaml pull

        - name: Deploy Product API
          shell: cmd
          run: |
            docker compose -f docker-compose-prod.yaml up -d

        - name: Wait for Product API healthcheck
          shell: cmd
          run: |
            setlocal EnableDelayedExpansion
            set STATUS=starting

            for /L %%i in (1,1,30) do (
              for /F "delims=" %%s in ('docker inspect -f "{{.State.Health.Status}}" product-api-prod 2^>nul') do set STATUS=%%s

              echo Product API health status: !STATUS!

              if "!STATUS!"=="healthy" (
                echo Product API is healthy.
                exit /b 0
              )

              timeout /t 2 /nobreak >nul
            )

            echo Product API did not become healthy.
            docker compose -f docker-compose-prod.yaml ps
            exit /b 1

        - name: Show production containers
          shell: cmd
          run: |
            docker compose -f docker-compose-prod.yaml ps