name: Product API CI - Production Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: 123456
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --username admin --password 123456 --authenticationDatabase admin --eval \"db.adminCommand('ping')\" --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        env:
          PORT: 3000
          MONGO_URI: mongodb://admin:123456@localhost:27017/productdb?authSource=admin
        run: |
          nohup node server.js > server.log 2>&1 &

      - name: Wait for Product API
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/health; then
              echo "Product API is healthy"
              exit 0
            fi
            echo "Waiting for Product API..."
            sleep 2
          done

          echo "Product API did not become healthy"
          cat server.log
          exit 1

      - name: Test Healthcheck
        run: |
          curl -f http://localhost:3000/health

      - name: Test CREATE product
        run: |
          curl -f -X POST http://localhost:3000/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"CI001","pname":"CI Product","price":100000,"quantity":10}'

      - name: Test READ products
        run: |
          curl -f http://localhost:3000/products

      - name: Test UPDATE product
        run: |
          PRODUCT_ID=$(curl -s http://localhost:3000/products | jq -r '.[0]._id')

          curl -f -X PUT http://localhost:3000/products/$PRODUCT_ID \
            -H "Content-Type: application/json" \
            -d '{"pname":"CI Product Updated","price":150000,"quantity":20}'

      - name: Test DELETE product
        run: |
          PRODUCT_ID=$(curl -s http://localhost:3000/products | jq -r '.[0]._id')

          curl -f -X DELETE http://localhost:3000/products/$PRODUCT_ID

      - name: Show server log if needed
        if: failure()
        run: |
          cat server.log